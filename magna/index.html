<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab</title>
    <link rel="stylesheet" href="magna.css" style="text/css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="titolo">AULA MAGNA</h1>
    </div>




    <div id="popup-overlay2" class="popup-overlay">
        <div class="popup-content-schermo">
				<div id="demo">click</div>
        </div>
    </div>
	
    <div id="popup-overlay3" class="popup-overlay">
        <div class="popup-content-foglio">
				<font family="Mystery Quest">inserire password</font>
        </div>
    </div>
	<div>
    <button><img src="assets/antenna.png" class="bottone" id="antenna"></button>	
	</div>
	
	<div>
	<button><img src="assets/schermo.png" class="bottone" id="schermo"></button>
	</div>
	

	<img onclick='move()'  src="assets/foglio.png" class="click-tracking"  id="foglio" class="bottone">



<script>
    window.onload = function () {
        move();
    }

    function move() {
        let img = document.getElementById('foglio');
        img.style.left = Math.floor(Math.random() * window.innerWidth) + "px";
        img.style.top = Math.floor(Math.random() * window.innerHeight) + "px";
    }

    var counts = {};
    var track = document.getElementsByClassName('click-tracking');

    for (var i = 0; i < track.length; i++) {
        track[i].addEventListener('click', function () {
            var name = this.dataset.name;

            if (typeof counts[name] === 'undefined') {
                counts[name] = 0;
            }

            counts[name]++;

            if (name === "foglio") {
                document.getElementById("demo").innerHTML = counts[name];
            }

            if (name === "schermo" && counts[name] === 3) {
                this.src = "assets/schermo_alt.png"; 
            }

            if (name === "foglio" && counts[name] > 3) {
                $("#popup-overlay1").fadeIn("slow");
            }

            if (name === "schermo") {
                $("#popup-overlay2").fadeIn("slow");
            }
        });
    }

    $(".popup-overlay").on("click", function (e) {
        if ($(e.target).is(".popup-overlay")) {
            $(this).fadeOut("slow");
        }
    });
</script>

</body>

</html>
