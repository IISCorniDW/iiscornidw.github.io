
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto Palestra</title>
  <link rel="icon" type="image/png" href="icona.png" sizes="32x32">
  <link href="style.css" rel="stylesheet" type="text/css">
  <style>
    .galleria {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 50px;
      flex-wrap: wrap;
    }

    .galleria img {
      width: 300px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .galleria img:hover {
      transform: scale(1.05);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      display: none;
    }

    .overlay img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      z-index: 2100;
      font-family: Arial, sans-serif;
    }

    .back-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #fe6f61;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    .back-btn:hover {
      background-color: #e65b54;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="titolo">Galleria della palestra</h1>
    <div class="galleria">
      <img src="palestra1.jpg" alt="Palestra 1" onclick="mostraOverlay(this.src)">
      <img src="palestra2.jpg" alt="Palestra 2" onclick="mostraOverlay(this.src)">
      <img src="palestra3.jpg" alt="Palestra 3" onclick="mostraOverlay(this.src)">
    </div>
  </div>

  <div class="overlay" id="overlay">
    <span class="close-btn" onclick="nascondiOverlay()">✖</span>
    <img id="overlay-img" src="" alt="Immagine Ingrandita">
  </div>

  <a href="index.html" class="back-btn">← Torna alla pagina iniziale</a>

  <script>
    function mostraOverlay(src) {
      const overlay = document.getElementById("overlay");
      const overlayImg = document.getElementById("overlay-img");
      overlayImg.src = src;
      overlay.style.display = "flex";
    }

    function nascondiOverlay() {
      document.getElementById("overlay").style.display = "none";
    }
  </script>
</body>
</html>
